---
# Instalação pelo Git Version Control do cPanel ("Deploy HEAD Commit"), a partir da raiz do repositório.
# O script copia site/ para public_html e app/ para ~/autosolutions-app, mantém no .htaccess a versão
# do PHP escolhida no MultiPHP Manager e tira a escrita para o grupo (que alguns alojamentos recusam).
# Não toca em ~/garc-conteudos nem no config.php.
deployment:
  tasks:
    - /bin/bash ferramentas/publicar.sh
